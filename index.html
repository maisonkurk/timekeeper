<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timekeeper</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="tabs">

    <button id="timerTab" class="active">
        Timer
    </button>

    <button id="messageTab">
        Additional Message
    </button>

    <button id="personalTab">
        Personal Space
    </button>

</div>

<div id="timerScreen">

    <div id="number">5</div>
    <div id="label">MINUTES</div>

</div>

<div id="messageScreen">

    <textarea
        id="messageInput"
        placeholder="Type your additional message here..."
    ></textarea>

    <div id="messageText">
        Enter Text Above
    </div>

</div>

<div id="personalScreen">

    <h1>Personal Space</h1>

    <div id="gallery">

        <img src="images/LV.jpeg">

        <img src="images/FuncMeet.jpeg">

        <img src="images/RiseUp.jpeg">

        <img src="images/ILoveYouAll.jpeg">


    </div>

</div>

    <div id="footer">
        Aziz · iGV ProCo
    </div>

    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
