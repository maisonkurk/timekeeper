<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timekeeper</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div id="tabs">

    <button id="timerTab" class="active">Timer</button>

    <button id="messageTab">Additional Message</button>

    <button id="personalTab">Personal Space</button>

</div>

<button id="fullscreenBtn">

    <img
        id="fullscreenIcon"
        src="images/fullscreen.png"
        alt="Fullscreen">

</button>

<div id="timerScreen" class="screen active">

<div id="timekeeping">

    <div id="timerModes">

        <button id="manualModeBtn" class="active">
            Manual
        </button>

        <button id="countdownModeBtn">
            Countdown
        </button>

    </div>

    <div id="manualMode">

        <div id="number">5</div>

        <div id="label">MINUTES</div>

    </div>

    <div id="countdownMode">

        <div id="countdownStatus">

    ● READY

</div>

        <div id="countdownDisplay">

            00:05:00

        </div>

        <div id="countdownControls">

            <button id="startBtn">Start</button>

            <button id="pauseBtn">Pause</button>

            <button id="resetBtn">Reset</button>

        </div>

    </div>

</div>

</div>

<div id="messageScreen" class="screen">

    <textarea
        id="messageInput"
        placeholder="Type your additional message here..."
    ></textarea>

    <div id="messageText">
        Enter Text Above
    </div>

</div>

<div id="personalScreen" class="screen">

    <h1>Personal Space</h1>

    <div id="gallery">

        <img src="images/LV.jpeg">

        <img src="images/FuncMeet.jpeg">

        <img src="images/RiseUp.jpeg">

        <img src="images/ILoveYouAll.jpeg">


    </div>

</div>

    <div id="footer">
        Aziz · iGV ProCo
    </div>

    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
