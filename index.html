<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timekeeper</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="tabs">

    <button id="timerTab" class="active">
        Timer
    </button>

    <button id="messageTab">
        Additional Message
    </button>

</div>

<div id="timerScreen">

    <div id="number">5</div>
    <div id="label">MINUTES</div>

</div>

<div id="messageScreen">

    <textarea
        id="messageInput"
        placeholder="Type message..."
    ></textarea>

    <div id="messageDisplay">
        Type something... </div>

</div>

    <div id="footer">
        Aziz · iGV ProCo
    </div>

<script src="script.js"></script>

</body>
</html>
